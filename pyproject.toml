[project]
name = "carcharoth"
version = "0.1.0"
description = "Algorithmic stock trading bot (Alpaca paper trading)"
readme = "README.md"
authors = [
    { name = "Felix Langbein", email = "felix.langbein@check24.de" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "alpaca-py>=0.43.5",
    "numpy>=2.5.0",
    "optuna>=4.2",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "scipy>=1.16",
    "sqlalchemy>=2.0",
    "ta-lib>=0.6",
    "tqdm>=4.67",
]

[project.scripts]
carcharoth = "carcharoth.main:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "scipy-stubs>=1.18.0.0",
    "types-pyyaml>=6.0.12.20260518",
    "types-tqdm>=4.67",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["alpaca.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
