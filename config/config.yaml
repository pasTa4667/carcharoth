# Carcharoth runtime configuration.
# Secrets (API keys, database URL) live in .env, not here.

watchlist:
  symbols: [AAPL, MSFT, GOOG, AMZN, NVDA, JPM, KO, TSLA, SPCX, AMD, T, AAL, INTC, SMCI, PFE]

engine:
  tick_interval_seconds: 60
  bar_timeframe_minutes: 5

strategy:
  name: mean_reversion
  params:
    lookback: 20              # bars used for rolling mean/std
    entry_z: -1.5             # buy when price is this many std devs below the mean
    exit_z: 0.0               # sell (exit) once the z-score reverts to/above the mean
    trend_ema_period: 50      # only buy when the rolling mean is above this EMA (trend filter)
    rsi_period: 14
    rsi_entry_max: 45.0       # only buy when RSI is below this (oversold confirmation)
    atr_period: 14
    atr_stop_multiplier: 3.5  # exit when price < avg_entry - this * ATR

risk:
  max_position_notional: 1000.0   # hard cap per position, in account currency
  max_position_pct_equity: 0.10   # per-position cap as fraction of equity
  max_total_exposure_pct: 0.50    # cap on sum of all position values vs equity
  max_open_positions: 5
  buying_power_buffer: 0.95       # only ever use this fraction of buying power
  slippage_buffer: 0.02           # assume fills up to this much worse than quote
  max_daily_loss_pct: 0.03        # stop opening positions after this daily drawdown
