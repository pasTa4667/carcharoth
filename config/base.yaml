# Carcharoth base layer: the complete model-driven config structure.

symbols: []

# Optional frozen universe snapshot. A selected bucket replaces inherited symbols.
universe:
  snapshot: null
  bucket: null
# Populated by the loader from the selected snapshot; never hand-edit.
universe_metadata: null

data:
  start: 2010-01-01
  end: 2010-06-30

engine:
  tick_interval_seconds: 60

model:
  prepared_history: false # Gated batch initialization; live always uses rolling history.
  # Training never changes this. Select an immutable artifact explicitly for
  # quicktest/backtest/live use, then promote that leaf to trading/paper.
  artifact_path: null
  timeframe_minutes: 5
  benchmark_symbol: SPY
  target: {type: regression, horizon_bars: 5}
  features:
    - {name: log_return, params: {period: 1}}
    - {name: log_return, params: {period: 5}}
    - {name: log_return, params: {period: 20}}
    - {name: log_return, params: {period: 60}}
    - {name: ema_distance, params: {period: 20}}
    - {name: ema_distance, params: {period: 60}}
    - {name: adx, params: {period: 14}}
    - {name: normalized_atr, params: {period: 14}}
    - {name: realized_volatility, params: {period: 20}}
    - {name: realized_volatility, params: {period: 60}}
    - {name: normalized_rsi, params: {period: 14}}
    - {name: range_position, params: {period: 20}}
    - {name: session_vwap_distance, params: {}}
    - {name: time_of_day_volume_zscore, params: {sessions: 20}}
    - {name: benchmark_return, params: {period: 5}}
    - {name: benchmark_return, params: {period: 20}}
    - {name: time_of_day, params: {component: sin}}
    - {name: time_of_day, params: {component: cos}}
  hmm:
    enabled: true
    evaluate_interval_minutes: 30
    n_states: 4
    training_window: 1560
    refit_interval_bars: 78
    min_confidence: 0.5
    seed: 42
    n_restarts: 2
    covariance_type: diag
    n_iter: 100
    tol: 0.001
    min_covar: 0.001
    winsorize_sigma: 5.0
    vol_window: 20
    ema_period: 50
    adx_period: 14
  decision:
    long_entry_threshold: 0.0005
    short_entry_threshold: -0.0005
    long_exit_threshold: 0.0
    short_exit_threshold: 0.0
    class_probability_threshold: 0.55
    entry_delay_minutes: 15
    entry_cutoff_minutes: 15
    flatten_minutes: 10
  xgboost_params:
    num_boost_round: 500
    eta: 0.05
    max_depth: 6
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0

training:
  train_start: 2023-01-01
  train_end: 2024-06-30
  validation_start: 2024-07-01
  validation_end: 2024-12-31
  artifact_root: artifacts/models
  seed: 42
  early_stopping_rounds: 50
  eligibility:
    mode: drop # strict rejects the whole attempt if any symbol fails.
    min_train_rows: 100
    min_validation_rows: 30
    min_usable_coverage: 0.80
    min_symbols: 1
    min_retained_fraction: 0.50

backtest:
  check_data_coverage: false # Report-only; never changes replay membership.
  initial_capital: 100000.0
  margin_multiplier: 2.0
  spread_pct: 0.0005
  slippage_pct: 0.0005
  permutation: null

quicktest:
  capital: 10000
  position_size_pct: 0.10
  spread_pct: 0.0005
  slippage_pct: 0.0005
  objective: default
  permutation:
    method: in_sample_bars
    n_permutations: 100
    seed: 42
    significance: 0.05
    workers: 0
    params: {}

optimization:
  study:
    name: xgboost-thresholds
    n_trials: 20
    workers: 2
    sampler_seed: 42
  objective: default
  constraints: []
  search_space: {}

cache:
  enabled: true
  bars: true
  hmm: true

objectives:
  default:
    weights:
      sharpe: 1.0
      total_return: 0.5
      max_drawdown: -2.0
    on_missing_metric: penalize
    penalty_score: -1.0e6

risk:
  max_position_notional: 1000.0
  max_position_pct_equity: 0.10
  max_total_exposure_pct: 0.50
  max_open_positions: 8
  buying_power_buffer: 0.95
  slippage_buffer: 0.02
  max_daily_loss_pct: 0.03
