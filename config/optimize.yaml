# Optimization study configuration for `carcharoth optimize`.
#
# Each search_space key is a dot-path into config.yaml; changing which
# parameters get optimized never requires a code change. Every trial is a
# normal, fully persisted backtest run (visible in Grafana); Optuna keeps
# its own study data in separate tables in the same Postgres.

study:
  name: hydra-quant-spta-26
  n_trials: 20
  workers: 2                 # parallel worker processes; trials are split across them
  sampler_seed: 42           # omit for nondeterministic sampling; with workers > 1
                             # each worker uses seed+index (not reproducible run-to-run)

backtest:
  start: 2025-01-01          # YYYY-MM-DD (UTC)
  end: 2025-06-30           # inclusive, like `carcharoth backtest --end`
  symbols: [
    "QQQ",
    "SPY",
    "ABNB",
    "ADBE",
    "ADI",
    "AFRM",
    "AKAM",
    "AMKR",
    "APP",
    "ASTS",
    "BBIO",
    "BKNG",
    "CART",
    "COIN",
    "CRWD",
    "DASH",
    "DDOG",
    "DXCM",
    "ENTG",
    "FAST",
    "FTNT",
    "GEHC",
    "GILD",
    "HOOD",
    "IBKR",
    "INSM",
    "INTU",
    "KDP",
    "LITE",
    "MCHP",
    "MDLZ",
    "MNST",
    "MRNA",
    "MRVL",
    "NDAQ",
    "NTAP",
    "OKTA",
    "ON",
    "ORLY",
    "PEP",
    "AMD",
    "AMZN",
    "AAPL",
    "GOOGL",
    "META",
    "MSFT",
    "NVDA",
    "AVGO",
    "TSLA",
    "COST"
  ]

# Which named objective (config.yaml `objectives:` section) the study
# maximizes. The optimizer reads the run's persisted `fitness_<name>` metric.
objective: default

# Hard constraints: a violating trial is reported to the sampler as heavily
# penalized (search guidance); the run's stored fitness stays untouched.
constraints:
  - {metric: num_trades, min: 110}
  - {metric: max_drawdown, max: 0.30}

search_space:
  strategies.mean_reversion.params.entry_z:
    {type: float, low: -3.0, high: -0.5, step: 0.1}
  strategies.mean_reversion.params.exit_z:
    {type: float, low: -0.5, high: 0.5, step: 0.1}
  strategies.mean_reversion.params.trend_ema_period:
    {type: categorical, choices: [20, 50, 100, 200]}
  strategies.mean_reversion.params.rsi_period:
    {type: categorical, choices: [7, 10, 14, 21]}
  strategies.mean_reversion.params.atr_period:
    {type: categorical, choices: [10, 14, 21]}
  strategies.mean_reversion.params.lookback:
    {type: int, low: 10, high: 60}
  strategies.mean_reversion.params.atr_stop_multiplier:
    {type: float, low: 1.5, high: 5.0}
  strategies.mean_reversion.params.rsi_entry_max:
    {type: float, low: 25.0, high: 50.0, step: 5.0}
  risk.max_position_pct_equity:
    {type: float, low: 0.05, high: 0.25, log: true}
