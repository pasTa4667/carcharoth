services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APCA_API_KEY_ID: ${APCA_API_KEY_ID}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY}
      APCA_API_BASE_URL: ${APCA_API_BASE_URL:-https://paper-api.alpaca.markets/v2}
      DATABASE_URL: postgresql+psycopg://carcharoth:carcharoth@db:5432/carcharoth
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carcharoth
      POSTGRES_PASSWORD: carcharoth
      POSTGRES_DB: carcharoth
    ports:
      - "5432:5432"
    volumes:
      - carcharoth_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-grafana-reader.sql:/docker-entrypoint-initdb.d/02-grafana-reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carcharoth -d carcharoth"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3333:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      # lets provisioning YAML reference env vars
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_reader}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped 

volumes:
  carcharoth_pgdata:
  grafana_data:
