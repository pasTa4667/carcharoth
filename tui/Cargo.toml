[package]
name = "carcharoth-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for the Carcharoth CLI and its layered configuration"
publish = false

[lib]
name = "carcharoth_tui"
path = "src/lib.rs"

[[bin]]
name = "carcharoth-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
