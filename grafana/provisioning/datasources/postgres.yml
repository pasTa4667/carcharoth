apiVersion: 1

datasources:
  - name: Carcharoth Postgres
    uid: carcharoth-pg
    type: postgres
    access: proxy
    url: db:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: carcharoth
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $__env{GRAFANA_DB_PASSWORD}